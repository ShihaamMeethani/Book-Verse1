name: bookverse
description: "BookVerse — a premium, feature-rich online bookstore app built with Flutter & Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.5
  firebase_crashlytics: ^3.4.16
  cloud_functions: ^4.6.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # ── State management ─────────────────────────────────────
  provider: ^6.1.2

  # ── UI / Animation ────────────────────────────────────────
  animate_do: ^3.3.4
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  fl_chart: ^0.67.0
  confetti: ^0.7.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2

  # ── Local storage / offline ──────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1

  # ── Notifications ─────────────────────────────────────────
  flutter_local_notifications: ^17.0.0

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  flutter_slidable: ^3.1.0
  pull_to_refresh: ^2.0.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.10+1
  in_app_review: ^2.0.9
  local_auth: ^2.2.0
  http: ^1.2.0
  pdf: ^3.13.0
  printing: 5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
